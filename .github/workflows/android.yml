name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner ya trae el Android SDK (ANDROID_HOME); setup-android@v3 falla con cmdline-tools 16

      - name: Dependencias
        run: npm ci

      - name: Copiar OCR y sincronizar Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PokePrecio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PokePrecio-apk
          path: PokePrecio.apk
