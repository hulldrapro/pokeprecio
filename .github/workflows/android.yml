name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # El runner ya trae el Android SDK (ANDROID_HOME); setup-android@v3 falla con cmdline-tools 16

      - name: Dependencias
        run: npm ci

      - name: Copiar OCR, códigos de sets y sincronizar Capacitor
        run: |
          npm run build
          node scripts/codigos-sets.js
          npx cap sync android

      - name: Llave de firma fija
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pokeprecio.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/pokeprecio.p12" >> "$GITHUB_ENV"
            echo "Firmando con la llave fija (las actualizaciones conservan la colección)"
          else
            echo "::warning::Sin secreto KEYSTORE_B64: APK de depuración con llave temporal (no se podrá actualizar encima)"
          fi

      - name: Versión (de package.json)
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=$VERSION
            cp app/build/outputs/apk/release/app-release.apk "../CardCalc-v$VERSION.apk"
          else
            ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }} -PversionName=$VERSION
            cp app/build/outputs/apk/debug/app-debug.apk "../CardCalc-v$VERSION.apk"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: CardCalc-apk
          path: CardCalc-v*.apk
