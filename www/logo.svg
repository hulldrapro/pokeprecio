<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f77"/>
      <stop offset=".55" stop-color="#4b2a8c"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe7ff"/>
      <stop offset=".35" stop-color="#b48cff"/>
      <stop offset=".65" stop-color="#ff8fd0"/>
      <stop offset="1" stop-color="#ffd36b"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset=".55" stop-color="#ffc107"/>
      <stop offset="1" stop-color="#e08a00"/>
    </linearGradient>
    <radialGradient id="brillo" cx=".3" cy=".25" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <rect width="512" height="512" rx="112" fill="url(#brillo)"/>

  <!-- carta inclinada -->
  <g transform="rotate(-12 230 250)" filter="url(#sombra)">
    <rect x="128" y="92" width="196" height="274" rx="20" fill="#f5f3ff"/>
    <rect x="142" y="106" width="168" height="246" rx="13" fill="url(#holo)"/>
    <!-- ventana de ilustración -->
    <rect x="158" y="128" width="136" height="104" rx="9" fill="#ffffff" opacity=".55"/>
    <path d="M168 220 L205 168 L232 200 L252 178 L284 220 Z" fill="#4b2a8c" opacity=".55"/>
    <circle cx="262" cy="152" r="11" fill="#fff" opacity=".85"/>
    <!-- líneas de texto -->
    <rect x="158" y="250" width="110" height="10" rx="5" fill="#ffffff" opacity=".7"/>
    <rect x="158" y="270" width="136" height="8" rx="4" fill="#ffffff" opacity=".5"/>
    <rect x="158" y="286" width="92" height="8" rx="4" fill="#ffffff" opacity=".5"/>
  </g>

  <!-- moneda con $ -->
  <g filter="url(#sombra)">
    <circle cx="338" cy="338" r="98" fill="url(#oro)"/>
    <circle cx="338" cy="338" r="98" fill="none" stroke="#fff3c4" stroke-width="6" opacity=".7"/>
    <circle cx="338" cy="338" r="76" fill="none" stroke="#b86e00" stroke-width="5" opacity=".55"/>
    <text x="338" y="374" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="112" fill="#5a3300">$</text>
  </g>

  <!-- destello -->
  <path d="M120 96 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z" fill="#fff" opacity=".9"/>
  <path d="M410 140 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6z" fill="#ffe066" opacity=".9"/>
</svg>
